http {
    upstream logistics_backend {
        server logistics.company.com
            max_fails=5
            fail_timeout=30s;   # 5 ошибок → не пытаться 30 секунд
    }

    server {
        listen 8080;

        # Fallback — отдаём локальный ответ
        location = /fallback_logistics {
            default_type application/json;
            return 200 '{"status":"fallback","message":"Logistics service unavailable"}';
        }

        location /logistics/ {
            proxy_pass http://logistics_backend;

            # Таймауты — 3 секунды
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;

            # Когда backend недоступен — отправляем на fallback
            proxy_next_upstream error timeout http_502 http_503 http_504;
            error_page 502 503 504 /fallback_logistics;
        }
    }
}
